<ion-header>
  <ion-toolbar>
    <ion-title>Our Services</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="service-banner" aria-hidden="true">
    <ion-icon name="image-outline"></ion-icon>
  </div>
  <h1 class="page-title">SERVICES</h1>

  <div class="service-list">
    @for (service of services; track service.serviceId) {
      <ion-card [routerLink]="['/carwash/services', service.serviceId]" class="service-card">
        <div class="service-art" aria-hidden="true">
          <ion-icon name="car-outline"></ion-icon>
        </div>
        <ion-card-header>
          <ion-card-title>{{ service.serviceName }}</ion-card-title>
          <ion-card-subtitle>
            {{ service.serviceType }} · {{ service.vehicleType }}
          </ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          <strong>₱{{ service.servicePrice | number:'1.0-0' }}</strong>
        </ion-card-content>
      </ion-card>
    }
  </div>
</ion-content>
